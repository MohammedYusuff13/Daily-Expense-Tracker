spring.application.name=daily-expense-tracker
server.port=8080

# ---- Excel storage configuration ----
# Path to the workbook that acts as the "database".
app.excel.file-path=./data/expense-tracker.xlsx
# Directory where timestamped backups are written.
app.excel.backup-dir=./data/backups
# Create an automatic backup before every write operation.
app.excel.auto-backup=true

# ---- CORS ----
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# ---- Multipart (Excel import) ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- Logging ----
logging.level.com.shoptracker.expense=INFO
